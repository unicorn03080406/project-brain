name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with the system sh (dash on Ubuntu, bash 3.2 on macOS)
        if: runner.os != 'Windows'
        run: sh tests/run.sh
      - name: Run tests with Git Bash
        if: runner.os == 'Windows'
        run: bash tests/run.sh
      - name: Scripts work when called with Windows paths (as Claude Code does)
        if: runner.os == 'Windows'
        run: |
          win=$(cygpath -w "$PWD")
          sh "$win\\scripts\\brain.sh" version | grep -q "project-brain"
          sh scripts/brain.sh scaffold "$RUNNER_TEMP/p" --name Win --mode private
          wp=$(cygpath -w "$RUNNER_TEMP/p" | sed 's/\\/\\\\/g')
          out=$(printf '{"session_id":"w1","cwd":"%s","source":"startup"}' "$wp" | sh "$win\\scripts\\hook.sh" session-start)
          echo "$out" | grep -q "Project brain: Win"
