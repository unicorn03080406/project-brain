name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with the system sh (dash on Ubuntu, bash 3.2 on macOS)
        if: runner.os != 'Windows'
        run: sh tests/run.sh
      - name: Run tests with Git Bash
        if: runner.os == 'Windows'
        run: bash tests/run.sh
